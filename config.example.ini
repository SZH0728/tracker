[global]
# HTTP 服务监听地址
host = 0.0.0.0
# HTTP 服务监听端口
port = 8080
# tracker 输出文件路径
output_file = tracker.txt
# 自动刷新周期（秒）
refresh_interval = 300

# 上游 tracker 数据源
[tracker.example]
url = https://example.com/tracker.txt
request_timeout = 10
retry = 2
retry_interval = 5
parser = text-lines
# 可选：请求头必须是 JSON 对象，键和值均为字符串
# header = {"User-Agent": "tracker-example/1.0"}

# 解析器配置别名
[parser.example-lines]
base = text-lines
# 可选：覆盖默认换行分隔符和 UTF-8 编码
# delimiter = ";"
# encoding = utf-8
